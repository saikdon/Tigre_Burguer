services:
  - type: web
    name: tigre-burger-pos
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_PORT
        value: 4000
      - key: DB_NAME
        value: tigre_burger_pos
      - key: DB_SSL
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
